<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Sistema de Manutenção Décio Metalúrgica</title>
<link rel="icon" href="{{ url_for('static', filename='img/logo_decio.png') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Manrope',system-ui,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0E1A28 0%,#10477D 55%,#28A353 130%);margin:0;padding:20px}
.caixa{width:100%;max-width:410px;background:#fff;border-radius:20px;padding:38px 34px;
  box-shadow:0 24px 60px rgba(0,0,0,.32)}
.logo{width:82px;height:82px;object-fit:contain;display:block;margin:0 auto 16px;
  border-radius:19px;background:#fff;padding:5px;box-shadow:0 4px 18px rgba(16,71,125,.2)}
h1{font-size:1.22rem;font-weight:800;text-align:center;color:#16202E;margin:0 0 3px;letter-spacing:-.02em}
.sub{text-align:center;color:#8B94A3;font-size:.76rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.13em;margin-bottom:26px}
.form-label{font-size:.76rem;font-weight:700;color:#56616F;text-transform:uppercase;letter-spacing:.05em}
.form-control{border-radius:10px;padding:.6rem .85rem;border-color:#D8E0EC}
.form-control:focus{border-color:#28A353;box-shadow:0 0 0 .18rem rgba(40,163,83,.15)}
.btn-entrar{background:linear-gradient(120deg,#28A353 0%,#10477D 100%);color:#fff;border:none;
  font-weight:800;border-radius:11px;padding:.7rem;width:100%;letter-spacing:.02em}
.btn-entrar:hover{filter:brightness(1.08);color:#fff}
.rodape{text-align:center;margin-top:22px;font-size:.72rem;color:#A8B0BD}
</style>
</head>
<body>
<div class="caixa">
  <img src="{{ url_for('static', filename='img/logo_decio.png') }}" class="logo" alt="Décio Metalúrgica">
  <h1>Sistema de Manutenção</h1>
  <div class="sub">Décio Metalúrgica</div>

  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}
      <div class="alert alert-{{ cat }} py-2 small" style="border-radius:10px">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="post">
    <div class="mb-3">
      <label class="form-label">Usuário</label>
      <input name="usuario" class="form-control" autofocus required autocomplete="username">
    </div>
    <div class="mb-4">
      <label class="form-label">Senha</label>
      <input type="password" name="senha" class="form-control" required autocomplete="current-password">
    </div>
    <button class="btn btn-entrar"><i class="bi bi-box-arrow-in-right me-1"></i> Entrar</button>
  </form>
  <div class="rodape">Manutenção Industrial e Predial · Matriz e Filial</div>
</div>
</body>
</html>
