{% extends "base.html" %}
{% block titulo %}Meu perfil{% endblock %}
{% block cabecalho %}Meu perfil{% endblock %}
{% block conteudo %}
<div class="row g-3">
  <div class="col-lg-6">
    <div class="card h-100">
      <div class="card-header"><i class="bi bi-person-fill me-1"></i> Meus dados</div>
      <div class="card-body">
        <form method="post">
          <input type="hidden" name="acao" value="dados">
          <div class="mb-3"><label class="form-label">Usuário</label>
            <input class="form-control" value="{{ usuario.usuario }}" disabled></div>
          <div class="mb-3"><label class="form-label">Perfil</label>
            <input class="form-control" value="{{ PERFIS.get(usuario.perfil, usuario.perfil) }}" disabled></div>
          <div class="mb-3"><label class="form-label">Nome</label>
            <input name="nome" class="form-control" value="{{ usuario.nome }}" required></div>
          <div class="mb-3"><label class="form-label">E-mail</label>
            <input type="email" name="email" class="form-control" value="{{ usuario.email or '' }}"></div>
          <div class="mb-3"><label class="form-label">Telefone</label>
            <input name="telefone" class="form-control" value="{{ usuario.telefone or '' }}"></div>
          <button class="btn btn-decio"><i class="bi bi-check-lg me-1"></i> Salvar</button>
        </form>
      </div>
    </div>
  </div>
  <div class="col-lg-6">
    <div class="card h-100">
      <div class="card-header"><i class="bi bi-shield-lock-fill me-1"></i> Alterar senha</div>
      <div class="card-body">
        <form method="post">
          <input type="hidden" name="acao" value="senha">
          <div class="mb-3"><label class="form-label">Senha atual</label>
            <input type="password" name="senha_atual" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">Nova senha</label>
            <input type="password" name="senha_nova" class="form-control" required minlength="6"></div>
          <div class="mb-3"><label class="form-label">Confirmar nova senha</label>
            <input type="password" name="senha_conf" class="form-control" required minlength="6"></div>
          <button class="btn btn-azul"><i class="bi bi-key-fill me-1"></i> Alterar senha</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
